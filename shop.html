<body>

<h1>🛒 Shopping Cart</h1>

<div class="product">

</div>

    <h2>📱 Phone</h2>

</div>

    <button onclick="addToCart('Headphone',3000)">Carttti Dabaluu</button>
</div>

<h2>🛍️ Cart</h2>

<h3 id="total">Waliigala: 0 Birr</h3>
