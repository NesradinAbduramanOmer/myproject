<div class="calendar">

    <div class="header">
        <button onclick="prevMonth()">◀</button>

        <h2 id="monthYear"></h2>

        <button onclick="nextMonth()">▶</button>
    </div>

    <div class="weekdays">
        <div>Su</div>
        <div>Mo</div>
        <div>Tu</div>
        <div>We</div>
        <div>Th</div>
        <div>Fr</div>
        <div>Sa</div>
    </div>

    <div id="calendarDays" class="days"></div>

</div>
